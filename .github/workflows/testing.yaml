name: Testing

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest

    steps:
      - id: checkout
        name: Checkout Repository
        uses: actions/checkout@v7

      - id: setup
        name: Setup Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt, clippy

      - id: node
        name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - id: cache
        name: Enable Workflow Cache
        uses: Swatinem/rust-cache@v2

      - id: linter
        name: Install Torrust Linter
        run: cargo install --locked --git https://github.com/torrust/torrust-linting --tag v0.1.0 --bin linter

      - id: lint
        name: Run All Linters
        run: linter all

  check:
    name: Static Analysis
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        toolchain: [nightly, stable]

    steps:
      - id: checkout
        name: Checkout Repository
        uses: actions/checkout@v7

      - id: setup
        name: Setup Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}

      - id: cache
        name: Enable Workflow Cache
        uses: Swatinem/rust-cache@v2

      - id: tools
        name: Install Tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete

      - id: check
        name: Run Build Checks
        run: cargo check --workspace --all-targets --all-features

      - id: docs
        name: Lint Documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --bins --examples --workspace --all-features

      - id: deps
        name: Check Unused Dependencies
        run: cargo machete --with-metadata

  build:
    name: Build on ${{ matrix.os }} (${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    needs: lint

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [nightly, stable]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - id: setup
        name: Setup Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}

      - id: cache
        name: Enable Workflow Cache
        uses: Swatinem/rust-cache@v2

      - name: Build project
        run: cargo build  --workspace --all-targets --all-features --verbose

  unit:
    name: Units
    runs-on: ubuntu-latest
    needs: check

    strategy:
      matrix:
        toolchain: [nightly, stable]

    steps:
      - id: checkout
        name: Checkout Repository
        uses: actions/checkout@v7

      - id: setup
        name: Setup Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}

      - id: cache
        name: Enable Job Cache
        uses: Swatinem/rust-cache@v2

      - id: tools
        name: Install Tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - id: test-docs
        name: Run Documentation Tests
        run: cargo test --doc --workspace

      - id: test
        name: Run Unit Tests
        run: cargo nextest run --workspace --all-targets --all-features
