[workspace]
members = [
  "examples/get_metadata",
  "examples/simple_torrent",
  "packages/bencode",
  "packages/dht",
  "packages/disk",
  "packages/handshake",
  "packages/info-hash",
  "packages/magnet",
  "packages/metainfo",
  "packages/peer",
  "packages/peer-id",
  "packages/select",
  "packages/util",
]

resolver = "2"

[workspace.package]
authors = [ "Nautilus Cyberneering <info@nautilus-cyberneering.de>, Andrew <amiller4421@gmail.com>" ]
categories = [ "network-programming", "web-programming" ]
description = "A collection of crates for building applications using bittorrent technologies."
documentation = "https://github.com/torrust/torrust-bittorrent"
edition = "2024"
homepage = "https://github.com/torrust/torrust-bittorrent"
keywords = [ "bittorrent" ]
license = "Apache-2.0"
# publish = false is the workspace default inherited by example crates.
# Each crate in packages/ sets its own publish and version fields explicitly.
# A crate is only published to crates.io when it is actively consumed by another
# Torrust project and has been validated in production use. Flip publish = true
# in the crate's own Cargo.toml when it is ready for a public release.
publish = false
repository = "https://github.com/torrust/torrust-bittorrent"
rust-version = "1.88"

[profile.bench]
codegen-units = 1
debug = false
debug-assertions = false
lto = false
opt-level = 3
panic = 'unwind'
rpath = false

[workspace.lints.rust]
deprecated-safe = { level = "deny", priority = -1 }
future-incompatible = { level = "deny", priority = -1 }
let-underscore = { level = "deny", priority = -1 }
nonstandard-style = { level = "deny", priority = -1 }
rust-2018-compatibility = { level = "deny", priority = -1 }
rust-2018-idioms = { level = "deny", priority = -1 }
rust-2021-compatibility = { level = "deny", priority = -1 }
rust-2024-compatibility = { level = "warn", priority = -1 }
unsafe-code = "warn"
unused = { level = "deny", priority = -2 }
warnings = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
