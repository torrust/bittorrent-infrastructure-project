[package]
description = "Torrust BitTorrent Disk Module"
keywords = [ "disk", "filesystem", "fs" ]
name = "torrust-disk"
readme = "README.md"

authors.workspace = true
categories.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = false                # override with publish = true when ready for a public release
rust-version.workspace = true

repository.workspace = true
version = "0.1.0"

[lints]
workspace = true

[dependencies]
torrust-metainfo = { path = "../metainfo" }
torrust-util = { path = "../util" }

bytes = "1"
crossbeam = "0"
futures = "0"
lru-cache = "0"
pin-project = "1"
thiserror = "2"
tokio = { version = "1", features = [ "full" ] }
tracing = "0"

[dev-dependencies]
criterion = { version = "0", features = [ "async_tokio" ] }
rand = "0.10"
tracing-subscriber = "0"

[[bench]]
harness = false
name = "disk_benchmark"
