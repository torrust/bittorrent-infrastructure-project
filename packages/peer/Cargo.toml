[package]
description = "Communication with bittorrent peers via peer wire protocol"
keywords = [ "bittorrent", "peer", "protocol", "pwp", "wire" ]
name = "torrust-peer"
readme = "README.md"

authors.workspace = true
categories.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

repository.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
torrust-bencode = { path = "../bencode" }
torrust-handshake = { path = "../handshake" }
torrust-util = { path = "../util" }

byteorder = "1"
bytes = "1"
crossbeam = "0"
futures = "0"
nom = "8"
pin-project = "1"
thiserror = "2"
tokio = { version = "1", features = [ "full" ] }
tokio-util = { version = "0", features = [ "codec" ] }
tracing = "0"

[dev-dependencies]
tracing-subscriber = "0"
