[package]
description = "Examples For bip-rs"
name = "simple_torrent"
readme = "README.md"

authors.workspace = true
categories.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

repository.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
torrust-disk = { path = "../../packages/disk" }
torrust-handshake = { path = "../../packages/handshake" }
torrust-metainfo = { path = "../../packages/metainfo" }
torrust-peer = { path = "../../packages/peer" }

clap = "4"
futures = "0"
tokio = { version = "1", features = [ "full" ] }
tokio-util = { version = "0", features = [ "codec" ] }
tracing = "0"
tracing-subscriber = "0"
